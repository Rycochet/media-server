services:
  owntone:
    container_name: owntone
    image: ${OWNTONE_IMAGE:-docker.io/owntone/owntone}:${OWNTONE_IMAGE_TAG:-latest}
    profiles: [ "${OWNTONE_PROFILE:-library}" ]
    restart: unless-stopped
    networks:
      - internal
      - external
    ports:
      - "3688:3688"
      - "3689:3689"
      - "5353:5353/udp"
      - "6600:6600"
    depends_on:
      traefik:
        condition: service_started
        restart: false
    logging:
      driver: "json-file"
      options:
        max-size: "1m"
        max-file: "3"
    environment:
      # Default
      TZ: "${TZ:-Europe/London}"
      PUID: "${PUID:-1000}"
      PGID: "${PGID:-1000}"
      UMASK: "000"
    volumes:
      - "/etc/localtime:/etc/localtime:ro"
      - "./config:/etc/owntone"
      - "./cache:/var/cache/owntone"
      - "$PATH_MUSIC:/data/music:ro"
    labels:
      deunhealth.restart.on.unhealthy: "true"
      homepage.group: "Libraries"
      homepage.name: "Owntone"
      homepage.icon: "owntone.png"
      homepage.href: "https://${OWNTONE_SUBDOMAIN:-owntone}.${DOMAIN}/"
      homepage.description: "iTunes media server"
      traefik.enable: "true"
      traefik.http.routers.owntone.rule: "Host(`${OWNTONE_SUBDOMAIN:-owntone}.${DOMAIN}`)"
      traefik.http.routers.owntone.middlewares: "tinyauth,error-pages"
      traefik.http.services.owntone.loadbalancer.server.port: "3689"
    healthcheck:
      start_period: "30s"
      test: "curl --connect-timeout 5 --silent --show-error --fail http://127.0.0.1:3689/"
