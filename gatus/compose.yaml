services:
  gatus:
    container_name: gatus
    image: ${GATUS_IMAGE:-ghcr.io/twin/gatus}:${GATUS_IMAGE_TAG:-stable}
    profiles: [ "${GATUS_PROFILE:-information}" ]
    restart: unless-stopped
    networks:
      - internal
    depends_on:
      socket-proxy:
        condition: service_healthy
        restart: false
      traefik:
        condition: service_started
        restart: false
      vpn:
        condition: service_started
        restart: false
    logging:
      driver: "json-file"
      options:
        max-size: "1m"
        max-file: "3"
    environment:
      # Default
      TZ: "${TZ:-Europe/London}"
      # Image
      DOCKER_HOST: "http://socket-proxy.internal:2375/v1.55"
      DOMAIN: "${DOMAIN}"
      GATUS_CONFIG_PATH: "/config"
      GATUS_LOG_LEVEL: "WARN" # DEBUG, INFO, WARN, ERROR, or FATAL
      GATUS_SUBDOMAIN: "${GATUS_SUBDOMAIN:-status}"
    volumes:
      - "/etc/localtime:/etc/localtime:ro"
      - "./config:/config"
      - "./data:/data"
    labels:
      deunhealth.restart.on.unhealthy: "true"
      homepage.group: "Information"
      homepage.name: "Gatus"
      homepage.icon: "gatus.png"
      homepage.href: "https://${GATUS_SUBDOMAIN:-status}.${DOMAIN}"
      homepage.description: "Status and uptime monitoring"
      homepage.widget.type: "gatus"
      homepage.widget.url: "http://gatus.internal:8080"
      homepage.widget.fields: "[\"up\", \"down\", \"uptime\"]"
      traefik.enable: "true"
      traefik.http.routers.gatus.rule: "Host(`${GATUS_SUBDOMAIN:-status}.${DOMAIN}`)"
      traefik.http.routers.gatus.middlewares: "${USE_CLOUDFLAREWARP:+cloudflarewarp,}${USE_CORS:+cors,}tinyauth,error-pages"
      traefik.http.services.gatus.loadbalancer.server.port: "8080"
    healthcheck:
      start_period: "30s"
