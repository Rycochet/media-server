# Seerr config for Gatus

ui:
  buttons:
    - name: Requests
      link: "https://${SEERR_SUBDOMAIN}.${DOMAIN}"

endpoints:
  - name: seerr.connection
    group: Requests
    url: "https://${SEERR_SUBDOMAIN}.${DOMAIN}"
    client:
      proxy-url: http://vpn.internal:8888
    conditions:
      - "[STATUS] == 200"

  - name: seerr.server-health
    group: Requests
    url: "${DOCKER_HOST}/containers/seerr/json"
    conditions:
      - "[STATUS] == 200"
      - "[BODY].State.Health.Status == healthy"
    ui:
      hide-hostname: true
