# zfdash config for the private Gatus

endpoints:
  - name: zfdash
    group: Healthcheck
    url: "${DOCKER_HOST}/containers/zfdash/json"
    interval: 1m
    conditions:
      - "[STATUS] == 200"
      - "[BODY].State.Health.Status == healthy"
    ui:
      hide-hostname: true
      hide-url: true
