services:
  jellyfin:
    container_name: jellyfin
    image: ${JELLYFIN_IMAGE:-docker.io/jellyfin/jellyfin}:${JELLYFIN_IMAGE_TAG:-12}
    profiles: [ "${JELLYFIN_PROFILE:-library}" ]
    extends:
      file: ../compose.extend.yaml
      service: "cf-${USE_CLOUDFLARED:-true}_gpu-${USE_GPU:-none}"
    restart: unless-stopped
    networks:
      - external
      - internal
    depends_on:
      traefik:
        condition: service_started
        restart: false
    logging:
      driver: "json-file"
      options:
        max-size: "1m"
        max-file: "3"
    ports:
      - "8096:8096"
      - "8920:8920" #optional
      - "7359:7359/udp" #optional
      - "1900:1900/udp" #optional
    user: "${PUID:-1000}:${PGID:-1000}"
    environment:
      # Default
      TZ: "${TZ:-Europe/London}"
      # Image
      JELLYFIN_PublishedServerUrl: "https://${JELLYFIN_SUBDOMAIN:-jellyfin}.${DOMAIN}"
      JELLYFIN_CACHE_DIR: "/cache"
      JELLYFIN_CONFIG_DIR: "/config"
      JELLYFIN_DATA_DIR: "/jellydata"
      JELLYFIN_LOG_DIR: "/logs"
    volumes:
      - "/etc/localtime:/etc/localtime:ro"
      - "./cache:/cache"
      - "./config:/config"
      - "./data:/jellydata"
      - "./logs:/logs"
      # This one can be worth remapping to a larger / slower drive -
      # - "/large_space/.jellyfin:/jellydata/data"
      - "$PATH_MOVIES:/data/movies:ro"
      - "$PATH_MUSIC:/data/music:ro"
      - "$PATH_TV:/data/tv:ro"
    labels:
      deunhealth.restart.on.unhealthy: "true"
      homepage.group: "Libraries"
      homepage.name: "Jellyfin"
      homepage.icon: "jellyfin.png"
      homepage.href: "https://${JELLYFIN_SUBDOMAIN:-jellyfin}.${DOMAIN}/web/#/home"
      homepage.description: "Media Library"
      homepage.widget.type: "jellyfin"
      homepage.widget.version: "2"
      homepage.widget.url: "http://jellyfin.internal:8096"
      homepage.widget.key: "{{HOMEPAGE_FILE_JELLYFIN_API}}"
      homepage.widget.enableBlocks: "true"
      homepage.widget.showEpisodeNumber: "true"
      homepage.widget.expandOneStreamToTwoRows: "false"
      traefik.enable: "true"
      traefik.http.routers.jellyfin.rule: "Host(`${JELLYFIN_SUBDOMAIN:-jellyfin}.${DOMAIN}`)"
      traefik.http.routers.jellyfin.middlewares: "${USE_CLOUDFLAREWARP:+cloudflarewarp,}${USE_CORS:+cors,}error-pages"
      traefik.http.services.jellyfin.loadbalancer.server.port: "8096"
    healthcheck:
      start_period: "30s"
      test: "curl --connect-timeout 5 --silent --show-error --fail http://127.0.0.1:8096/health"

  homepage:
    secrets:
      - jellyfin_api
    environment:
      HOMEPAGE_FILE_JELLYFIN_API: "/run/secrets/jellyfin_api"

  traefik:
    networks:
      internal:
        aliases:
          - "${JELLYFIN_SUBDOMAIN:-jellyfin}.${DOMAIN}"

secrets:
  jellyfin_api:
    environment: "JELLYFIN_API"
