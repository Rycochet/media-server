# beszel config for the private Gatus

endpoints:
  - name: beszel
    group: Healthcheck
    url: "${DOCKER_HOST}/containers/beszel/json"
    interval: 1m
    conditions:
      - "[STATUS] == 200"
      - "[BODY].State.Health.Status == healthy"
    ui:
      hide-hostname: true
      hide-url: true

  - name: beszel-agent
    group: Healthcheck
    url: "${DOCKER_HOST}/containers/beszel-agent/json"
    interval: 1m
    conditions:
      - "[STATUS] == 200"
      - "[BODY].State.Health.Status == healthy"
    ui:
      hide-hostname: true
      hide-url: true
