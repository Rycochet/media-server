services:
  qbittorrent:
    container_name: qbittorrent
    image: ${QBITTORRENT_IMAGE:-lscr.io/linuxserver/qbittorrent}:${QBITTORRENT_IMAGE_TAG:-latest}
    profiles: [ "${QBITTORRENT_PROFILE:-download}" ]
    extends:
      file: ../compose.extend.yaml
      service: "vpn-${USE_VPN:-false}"
    restart: unless-stopped
    networks:
      - internal
    # With USE_VPN=true there's no direct internet, so set qBittorrent's proxy
    # to SOCKS5 "vpn" port 1080 and use it for peer connections. Most VPN
    # providers don't allow incoming connections, so this listening port only
    # works if the "external" network is added back in compose.override.yaml -
    # outgoing connections still use the VPN, but incoming peers see your IP.
    # - external
    ports:
      - "51414:51414"
    depends_on:
      traefik:
        condition: service_started
        restart: false
    logging:
      driver: "json-file"
      options:
        max-size: "1m"
        max-file: "3"
    environment:
      # Default
      TZ: "${TZ:-Europe/London}"
      PUID: "${PUID:-1000}"
      PGID: "${PGID:-1000}"
      UMASK: "000"
    volumes:
      - "/etc/localtime:/etc/localtime:ro"
      - "./config:/config"
      - "./logs:/config/qBittorrent/logs"
      - "$PATH_DOWNLOADS:/data/Downloads"
    labels:
      deunhealth.restart.on.unhealthy: "true"
      homepage.group: "Download"
      homepage.name: "qBittorrent"
      homepage.icon: "qbittorrent.png"
      homepage.href: "https://${QBITTORRENT_SUBDOMAIN:-qbittorrent}.${DOMAIN}/"
      homepage.description: "Torrents"
      homepage.widget.type: "qbittorrent"
      homepage.widget.url: "http://qbittorrent.internal:8080"
      traefik.enable: "true"
      traefik.http.routers.qbittorrent.rule: "Host(`${QBITTORRENT_SUBDOMAIN:-qbittorrent}.${DOMAIN}`)"
      traefik.http.routers.qbittorrent.middlewares: "${USE_CORS:+cors,}tinyauth,error-pages"
      traefik.http.services.qbittorrent.loadbalancer.server.port: "8080"
    healthcheck:
      start_period: "30s"
      test: "curl --connect-timeout 5 --silent --show-error --fail http://127.0.0.1:8080/"
