# postgres config for the private Gatus

endpoints:
  - name: postgres
    group: Healthcheck
    url: "${DOCKER_HOST}/containers/postgres/json"
    interval: 1m
    conditions:
      - "[STATUS] == 200"
      - "[BODY].State.Health.Status == healthy"
    ui:
      hide-hostname: true
      hide-url: true

# postgres-backup reports every backup here, and it goes down if a backup fails
# or none has been tested for POSTGRES_BACKUP_MAX_AGE hours
external-endpoints:
  - name: postgres
    group: Backup
    token: "${POSTGRES_BACKUP_GATUS_TOKEN}"
    heartbeat:
      interval: "${POSTGRES_BACKUP_MAX_AGE}h"
