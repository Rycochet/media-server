services:
  handbrake:
    container_name: handbrake
    image: ${HANDBRAKE_IMAGE:-docker.io/jlesage/handbrake}:${HANDBRAKE_IMAGE_TAG:-latest}
    profiles: [ "${HANDBRAKE_PROFILE:-media}" ]
    extends:
      file: ../compose.extend.yaml
      service: "gpu-${USE_GPU:-none}"
    restart: unless-stopped
    networks:
      - internal
    depends_on:
      traefik:
        condition: service_started
        restart: false
    logging:
      driver: "json-file"
      options:
        max-size: "1m"
        max-file: "3"
    environment:
      # Default
      TZ: "${TZ:-Europe/London}"
      USER_ID: "${PUID:-1000}"
      GROUP_ID: "${PGID:-1000}"
      UMASK: "000"
      # Image
      KEEP_APP_RUNNING: "1"
    volumes:
      - "./config:/config"
      - "$PATH_DOWNLOADS:/data/Downloads"
    labels:
      deunhealth.restart.on.unhealthy: "true"
      homepage.group: "Media"
      homepage.name: "Handbrake"
      homepage.icon: "handbrake.png"
      homepage.href: "https://${HANDBRAKE_SUBDOMAIN:-handbrake}.${DOMAIN}"
      homepage.description: "Video Transcoder"
      traefik.enable: "true"
      traefik.http.routers.handbrake.rule: "Host(`${HANDBRAKE_SUBDOMAIN:-handbrake}.${DOMAIN}`)"
      traefik.http.routers.handbrake.middlewares: "error-pages"
      traefik.http.services.handbrake.loadbalancer.server.port: "5800"
      traefik.http.services.handbrake.loadbalancer.server.scheme: "http"
