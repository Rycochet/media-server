services:
  subgen:
    container_name: subgen
    image: ${SUBGEN_IMAGE:-docker.io/mccloud/subgen}:${SUBGEN_IMAGE_TAG:-latest}
    profiles: [ "${SUBGEN_PROFILE:-quality}" ]
    extends:
      file: ../compose.extend.yaml
      service: "gpu-${USE_GPU:-none}"
    restart: unless-stopped
    networks:
      - external
      - internal
    # depends_on:
    #   bazarr:
    #     condition: service_started
    #     restart: false
    logging:
      driver: "json-file"
      options:
        max-size: "1m"
        max-file: "3"
    environment:
      # Default
      PUID: "${PUID:-1000}"
      PGID: "${PGID:-1000}"
      # Image
      DEBUG: "False"
      DETECT_LANGUAGE_LENGTH: "120"
      LOG_LEVEL: "warn"
      SHOW_IN_SUBNAME_MODEL: "False"
      SHOW_IN_SUBNAME_SUBGEN: "False"
      SKIP_IF_INTERNAL_SUBTITLES_LANGUAGE: "xxxxx"
      TRANSCRIBE_DEVICE: "cuda"
      WHISPER_MODEL: "distil-large-v3.5"
      # For auto-transcribe - https://github.com/McCloudS/subgen#-integrations--webhooks-setup
      # JELLYFINSERVER: "http://jellyfin.internal:8096"
      # JELLYFINTOKEN: "${JELLYFIN_API}"
      # PLEXSERVER: "https://${PLEX_SUBDOMAIN:-plex}.${DOMAIN}:443"
      # PLEXTOKEN: "${PLEX_TOKEN}"
    volumes:
      - "/etc/localtime:/etc/localtime:ro"
      - "./config:/subgen/models"
      - "$PATH_MOVIES:/data/movies"
      - "$PATH_TV:/data/tv"
    labels:
      com.centurylinklabs.watchtower.monitor-only: "true"
      deunhealth.restart.on.unhealthy: "false"
      homepage.group: "Tools"
      homepage.name: "Subgen"
      homepage.icon: "/images/subgen.png"
      homepage.description: "Audio transcription"
      traefik.enable: "false"
