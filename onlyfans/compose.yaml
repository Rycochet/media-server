services:
  onlyfans:
    container_name: onlyfans
    image: ${ONLYFANS_IMAGE:-ghcr.io/datawhores/of-scraper}:${ONLYFANS_IMAGE_TAG:-stable}
    profiles: ["${ONLYFANS_PROFILE:-download}"]
    restart: unless-stopped
    networks:
      - external
    logging:
      driver: "json-file"
      options:
        max-size: "1m"
        max-file: "3"
    environment:
      # Default
      TZ: "${TZ:-Europe/London}"
      UID: "${PUID:-1000}"
      GID: "${PGID:-1000}"
      UMASK: "000"
      # Image
      APP_HOME: "/config"
      DATA_DIR: "/data"
      HOME_FOLDER: "/data"
      KEEP_PERM: "true"
    stdin_open: true
    tty: true
    volumes:
      - "./config:/config"
      - "./data:/data"
      - "./logs:/config/logging"
      # - "/usr/bin/ffmpeg:/usr/bin/ffmpeg:ro" # standalone build
      # - "/usr/local/bin/mp4decrypt:/usr/local/bin/mp4decrypt:ro"
      - "$PATH_ONLYFANS:/data/OnlyFans"
    command:
      - ofscraper
      # - "--daemon"
      # - "10800" # 3600 = hour, 10800 = 3 hours
      - "--posts"
      - "all"
      - "--action"
      - "download,like"
      - "--username"
      - "ALL"
      # - "--force-model-unique"
    labels:
      deunhealth.restart.on.unhealthy: "false"
      traefik.enable: "false"
