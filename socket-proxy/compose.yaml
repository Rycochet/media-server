services:
  socket-proxy:
    container_name: socket-proxy
    image: ${SOCKET_PROXY_IMAGE:-docker.io/wollomatic/socket-proxy}:${SOCKET_PROXY_IMAGE_TAG:-1}
    profiles: [ "${SOCKET_PROXY_PROFILE:-core}" ]
    restart: unless-stopped
    networks:
      - internal
    read_only: true
    user: "65534:${DOCKER_GID:?Set DOCKER_GID to the group id of the docker socket!}"
    cap_drop:
      - ALL
    security_opt:
      - "no-new-privileges=true"
    # Access is granted per-container with `socket-proxy.allow.*` labels on each client
    command:
      - "-allowhealthcheck"
      - "-listenip=0.0.0.0"
      - "-loglevel=info" # DEBUG, INFO, WARN, ERROR - blocked requests are logged at WARN
      - "-proxycontainername=socket-proxy"
      - "-shutdowngracetime=5"
      - "-stoponwatchdog"
      - "-watchdoginterval=3600"
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
    labels:
      deunhealth.restart.on.unhealthy: "true"
      homepage.group: "Tools"
      homepage.name: "Socket-proxy"
      homepage.icon: "docker.png"
      homepage.description: "Docker socket proxy"
      traefik.enable: "false"
    healthcheck:
      start_period: "30s"
      test: [ "CMD", "./healthcheck" ]
